[project]
name = "cubesat_testbed"
version = "1.0.0"
description = "Deterministic CubeSat subsystem emulation and hardware-in-the-loop testbed"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Egor Rakitin", email = "georgeglocker@gmail.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Emulators",
    "Topic :: System :: Hardware",
]
dependencies = [
    "pydantic>=2.8",
    "PyYAML>=6.0",
    "python-can>=4.4",
]

[project.urls]
Homepage = "https://github.com/glocker/CubeSatTestbed"
Repository = "https://github.com/glocker/CubeSatTestbed"
Issues = "https://github.com/glocker/CubeSatTestbed/issues"
Changelog = "https://github.com/glocker/CubeSatTestbed/blob/main/CHANGELOG.md"

[project.scripts]
cubesat-testbed = "cubesat_testbed.main:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cubesat_testbed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "socketcan: requires an explicitly configured Linux SocketCAN interface",
]

[tool.mypy]
python_version = "3.11"
strict = true
