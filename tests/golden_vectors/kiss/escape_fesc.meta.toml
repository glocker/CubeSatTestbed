name = "escape_fesc"
capture = "escape_fesc.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "python3 /app/tests/golden_vectors/scripts/capture-kiss.py /app/tests/golden_vectors/kiss/escape_fesc.txt 1 -- /app/tests/golden_vectors/bin/csp_client -k {tty} -p -d 2 -l 4 -b 0xdb"
capture_command = "capture-kiss.py opens a pty pair, runs csp_client -k <pty slave> and records the bytes libcsp's KISS interface writes"
interface = "pty"
meaning = "Payload 0xDB 0xDC 0xDD 0xDE: FESC is escaped as DB DD and the following 0xDC/0xDD bytes are sent unchanged."
protocol = "CSP v2 over KISS (serial), one CSP packet per frame"
source_address = 1
destination_address = 2
expected_frame_count = 1
expected_frames_hex = ["C0 00 80 02 00 04 14 80 DB DD DC DD DE D2 8A 3F D1 C0"]
expected_packets_hex = ["80 02 00 04 14 80 DB DC DD DE D2 8A 3F D1"]
