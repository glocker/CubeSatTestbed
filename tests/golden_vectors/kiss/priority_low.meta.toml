name = "priority_low"
capture = "priority_low.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "python3 /app/tests/golden_vectors/scripts/capture-kiss.py /app/tests/golden_vectors/kiss/priority_low.txt 1 -- /app/tests/golden_vectors/bin/csp_client -k {tty} -p -d 2 -r 3"
capture_command = "capture-kiss.py opens a pty pair, runs csp_client -k <pty slave> and records the bytes libcsp's KISS interface writes"
interface = "pty"
meaning = "CSP_PRIO_LOW (3): the first header byte is 0xC0 and so is escaped on the wire as DB DC."
protocol = "CSP v2 over KISS (serial), one CSP packet per frame"
source_address = 1
destination_address = 2
expected_frame_count = 1
expected_frames_hex = ["C0 00 DB DC 02 00 04 14 80 55 36 A9 9D 9E C0"]
expected_packets_hex = ["C0 02 00 04 14 80 55 36 A9 9D 9E"]
