name = "escape_fend"
capture = "escape_fend.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "python3 /app/tests/golden_vectors/scripts/capture-kiss.py /app/tests/golden_vectors/kiss/escape_fend.txt 1 -- /app/tests/golden_vectors/bin/csp_client -k {tty} -p -d 2 -l 4 -b 0xc0"
capture_command = "capture-kiss.py opens a pty pair, runs csp_client -k <pty slave> and records the bytes libcsp's KISS interface writes"
interface = "pty"
meaning = "Payload 0xC0 0xC1 0xC2 0xC3: the leading FEND byte is escaped on the wire as DB DC."
protocol = "CSP v2 over KISS (serial), one CSP packet per frame"
source_address = 1
destination_address = 2
expected_frame_count = 1
expected_frames_hex = ["C0 00 80 02 00 04 14 80 DB DC C1 C2 C3 AB 2E 61 D8 C0"]
expected_packets_hex = ["80 02 00 04 14 80 C0 C1 C2 C3 AB 2E 61 D8"]
