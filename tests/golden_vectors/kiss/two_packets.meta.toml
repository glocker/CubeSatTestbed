name = "two_packets"
capture = "two_packets.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "python3 /app/tests/golden_vectors/scripts/capture-kiss.py /app/tests/golden_vectors/kiss/two_packets.txt 2 -- /app/tests/golden_vectors/bin/csp_client -k {tty} -p -d 2 -l 3 -n 2"
capture_command = "capture-kiss.py opens a pty pair, runs csp_client -k <pty slave> and records the bytes libcsp's KISS interface writes"
interface = "pty"
meaning = "Two back-to-back 3-byte packets: two KISS frames; the second differs from the first only in its ephemeral source port."
protocol = "CSP v2 over KISS (serial), one CSP packet per frame"
source_address = 1
destination_address = 2
expected_frame_count = 2
expected_frames_hex = ["C0 00 80 02 00 04 14 80 55 56 57 DB DC CE B0 C2 C0", "C0 00 80 02 00 04 14 DB DC 55 56 57 DB DC CE B0 C2 C0"]
expected_packets_hex = ["80 02 00 04 14 80 55 56 57 C0 CE B0 C2", "80 02 00 04 14 C0 55 56 57 C0 CE B0 C2"]
