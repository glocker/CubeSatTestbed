name = "reverse_direction"
capture = "reverse_direction.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "python3 /app/tests/golden_vectors/scripts/capture-kiss.py /app/tests/golden_vectors/kiss/reverse_direction.txt 1 -- /app/tests/golden_vectors/bin/csp_client -k {tty} -p -a 2 -d 1"
capture_command = "capture-kiss.py opens a pty pair, runs csp_client -k <pty slave> and records the bytes libcsp's KISS interface writes"
interface = "pty"
meaning = "Source 2 destination 1: the baseline node pair addressed the other way."
protocol = "CSP v2 over KISS (serial), one CSP packet per frame"
source_address = 2
destination_address = 1
expected_frame_count = 1
expected_frames_hex = ["C0 00 80 01 00 08 14 80 55 36 A9 9D 9E C0"]
expected_packets_hex = ["80 01 00 08 14 80 55 36 A9 9D 9E"]
