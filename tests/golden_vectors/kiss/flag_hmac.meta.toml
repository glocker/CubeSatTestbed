name = "flag_hmac"
capture = "flag_hmac.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "python3 /app/tests/golden_vectors/scripts/capture-kiss.py /app/tests/golden_vectors/kiss/flag_hmac.txt 1 -- /app/tests/golden_vectors/bin/csp_client -k {tty} -p -d 2 -o hmac -l 4"
capture_command = "capture-kiss.py opens a pty pair, runs csp_client -k <pty slave> and records the bytes libcsp's KISS interface writes"
interface = "pty"
meaning = "CSP_FLAG_HMAC set: libcsp appends a 4-byte HMAC trailer to the payload and the KISS interface then appends its CRC32 over both."
protocol = "CSP v2 over KISS (serial), one CSP packet per frame"
source_address = 1
destination_address = 2
expected_frame_count = 1
expected_frames_hex = ["C0 00 80 02 00 04 14 88 55 56 57 58 52 8C 9E 11 DE C5 84 16 C0"]
expected_packets_hex = ["80 02 00 04 14 88 55 56 57 58 52 8C 9E 11 DE C5 84 16"]
