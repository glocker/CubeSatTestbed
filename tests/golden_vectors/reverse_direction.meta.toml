name = "reverse_direction"
capture = "reverse_direction.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "/app/tests/golden_vectors/bin/csp_client -c vcan0 -p -a 2 -d 1"
capture_command = "candump -n 1 vcan0 > /app/tests/golden_vectors/reverse_direction.txt"
interface = "vcan0"
meaning = "Single-frame CSP v2 ping-port request from node 2 to node 1: source/destination swapped relative to the ping_node_2 vector, so the codec's decode is exercised on both directions of the same node pair rather than only ever decoding traffic addressed to node 2."
protocol = "CSP v2 over classic CAN 2.0B extended frame"
source_address = 2
destination_address = 1
expected_extended_can_id = "0x10002103"
expected_payload_hex = "00 08 14 80 55"
