name = "high_address"
capture = "high_address.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "zmqproxy & zmq_capture tcp://127.0.0.1:7000 1 15 /app/tests/golden_vectors/zmq/high_address.txt & /app/tests/golden_vectors/bin/csp_client -z 127.0.0.1 -p -a 65 -d 66"
capture_command = "regenerate-zmq-vectors.sh runs libcsp's zmqproxy hub, subscribes zmq_capture to its publish port (7000) and sends with csp_client -z through the subscribe port (6000)"
interface = "zmq"
meaning = "Source 65 destination 66: the message carries the full 14-bit source address, unlike the 6-bit CAN-ID sender field."
protocol = "CSP v2 over ZeroMQ (libcsp zmqhub), one CSP packet per message"
source_address = 65
destination_address = 66
expected_message_count = 1
expected_messages_hex = ["80 42 01 04 14 80 55"]
expected_payloads_hex = ["55"]
