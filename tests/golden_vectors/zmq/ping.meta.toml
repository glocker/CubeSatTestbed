name = "ping"
capture = "ping.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "zmqproxy & zmq_capture tcp://127.0.0.1:7000 1 15 /app/tests/golden_vectors/zmq/ping.txt & /app/tests/golden_vectors/bin/csp_client -z 127.0.0.1 -p -d 2"
capture_command = "regenerate-zmq-vectors.sh runs libcsp's zmqproxy hub, subscribes zmq_capture to its publish port (7000) and sends with csp_client -z through the subscribe port (6000)"
interface = "zmq"
meaning = "Baseline CSP v2 ping-port request through a libcsp ZeroMQ hub from node 1 to node 2 with a 1-byte payload 0x55 and no CSP flags. The message is just the 6-byte header and the payload: no CRC32, no framing, no topic."
protocol = "CSP v2 over ZeroMQ (libcsp zmqhub), one CSP packet per message"
source_address = 1
destination_address = 2
expected_message_count = 1
expected_messages_hex = ["80 02 00 04 14 80 55"]
expected_payloads_hex = ["55"]
