name = "flag_crc32"
capture = "flag_crc32.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "zmqproxy & zmq_capture tcp://127.0.0.1:7000 1 15 /app/tests/golden_vectors/zmq/flag_crc32.txt & /app/tests/golden_vectors/bin/csp_client -z 127.0.0.1 -p -d 2 -o crc32 -l 4"
capture_command = "regenerate-zmq-vectors.sh runs libcsp's zmqproxy hub, subscribes zmq_capture to its publish port (7000) and sends with csp_client -z through the subscribe port (6000)"
interface = "zmq"
meaning = "CSP_FLAG_CRC32 set: libcsp appends its own 4-byte CRC32 trailer to the payload, and the ZeroMQ interface adds no second CRC32 (unlike KISS)."
protocol = "CSP v2 over ZeroMQ (libcsp zmqhub), one CSP packet per message"
source_address = 1
destination_address = 2
expected_message_count = 1
expected_messages_hex = ["80 02 00 04 14 81 55 56 57 58 AB F7 49 CE"]
expected_payloads_hex = ["55 56 57 58 AB F7 49 CE"]
