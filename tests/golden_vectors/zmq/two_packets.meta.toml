name = "two_packets"
capture = "two_packets.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "zmqproxy & zmq_capture tcp://127.0.0.1:7000 2 15 /app/tests/golden_vectors/zmq/two_packets.txt & /app/tests/golden_vectors/bin/csp_client -z 127.0.0.1 -p -d 2 -l 3 -n 2"
capture_command = "regenerate-zmq-vectors.sh runs libcsp's zmqproxy hub, subscribes zmq_capture to its publish port (7000) and sends with csp_client -z through the subscribe port (6000)"
interface = "zmq"
meaning = "Two back-to-back 3-byte packets: two messages; the second differs from the first only in its ephemeral source port."
protocol = "CSP v2 over ZeroMQ (libcsp zmqhub), one CSP packet per message"
source_address = 1
destination_address = 2
expected_message_count = 2
expected_messages_hex = ["80 02 00 04 14 80 55 56 57", "80 02 00 04 14 C0 55 56 57"]
expected_payloads_hex = ["55 56 57", "55 56 57"]
