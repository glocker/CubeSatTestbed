name = "high_address"
capture = "high_address.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "zmqproxy & zmq_capture tcp://127.0.0.1:7000 1 15 /app/tests/golden_vectors/csp_v1/zmq/high_address.txt & /app/tests/golden_vectors/bin/csp_client -z 127.0.0.1 -p -v 1 -a 30 -d 29 -r 2 -l 1"
capture_command = "regenerate-v1-whole-packet-vectors.py runs libcsp's zmqproxy hub, subscribes zmq_capture to its publish port (7000) and sends with csp_client -z through the subscribe port (6000)"
interface = "zmq"
meaning = "Between the highest usable CSP v1 addresses (30 to 29): the first byte of the message is the destination, 29 (0x1D)."
protocol = "CSP v1 over ZeroMQ (libcsp zmqhub), one CSP packet per message"
csp_version = 1
source_address = 30
destination_address = 29
priority = 2
destination_port = 1
csp_flags = 0
payload_length = 1
trailer_length = 0
packet_count = 1
expected_message_count = 1
expected_messages_hex = ["1D BD D0 52 00 55"]
expected_destination_prefixes = [29]
expected_csp_headers_hex = ["BD D0 52 00"]
expected_payloads_hex = ["55"]
