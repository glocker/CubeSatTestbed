name = "flag_crc32"
capture = "flag_crc32.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "zmqproxy & zmq_capture tcp://127.0.0.1:7000 1 15 /app/tests/golden_vectors/csp_v1/zmq/flag_crc32.txt & /app/tests/golden_vectors/bin/csp_client -z 127.0.0.1 -p -v 1 -a 1 -d 2 -r 2 -l 4 -o crc32"
capture_command = "regenerate-v1-whole-packet-vectors.py runs libcsp's zmqproxy hub, subscribes zmq_capture to its publish port (7000) and sends with csp_client -z through the subscribe port (6000)"
interface = "zmq"
meaning = "The CRC32 flag: libcsp's own 4-byte trailer is in the payload; the ZeroMQ interface adds no checksum of its own."
protocol = "CSP v1 over ZeroMQ (libcsp zmqhub), one CSP packet per message"
csp_version = 1
source_address = 1
destination_address = 2
priority = 2
destination_port = 1
csp_flags = 1
payload_length = 4
trailer_length = 4
packet_count = 1
expected_message_count = 1
expected_messages_hex = ["02 82 20 52 01 55 56 57 58 AB F7 49 CE"]
expected_destination_prefixes = [2]
expected_csp_headers_hex = ["82 20 52 01"]
expected_payloads_hex = ["55 56 57 58 ab f7 49 ce"]
