name = "two_packets"
capture = "two_packets.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "zmqproxy & zmq_capture tcp://127.0.0.1:7000 2 15 /app/tests/golden_vectors/csp_v1/zmq/two_packets.txt & /app/tests/golden_vectors/bin/csp_client -z 127.0.0.1 -p -v 1 -a 1 -d 2 -r 2 -l 3 -n 2"
capture_command = "regenerate-v1-whole-packet-vectors.py runs libcsp's zmqproxy hub, subscribes zmq_capture to its publish port (7000) and sends with csp_client -z through the subscribe port (6000)"
interface = "zmq"
meaning = "Two back-to-back packets: two messages, differing in the source port libcsp picks per connection."
protocol = "CSP v1 over ZeroMQ (libcsp zmqhub), one CSP packet per message"
csp_version = 1
source_address = 1
destination_address = 2
priority = 2
destination_port = 1
csp_flags = 0
payload_length = 3
trailer_length = 0
packet_count = 2
expected_message_count = 2
expected_messages_hex = ["02 82 20 52 00 55 56 57", "02 82 20 53 00 55 56 57"]
expected_destination_prefixes = [2, 2]
expected_csp_headers_hex = ["82 20 52 00", "82 20 53 00"]
expected_payloads_hex = ["55 56 57", "55 56 57"]
