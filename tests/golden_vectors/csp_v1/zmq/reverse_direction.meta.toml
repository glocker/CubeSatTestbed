name = "reverse_direction"
capture = "reverse_direction.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "zmqproxy & zmq_capture tcp://127.0.0.1:7000 1 15 /app/tests/golden_vectors/csp_v1/zmq/reverse_direction.txt & /app/tests/golden_vectors/bin/csp_client -z 127.0.0.1 -p -v 1 -a 2 -d 1 -r 2 -l 1"
capture_command = "regenerate-v1-whole-packet-vectors.py runs libcsp's zmqproxy hub, subscribes zmq_capture to its publish port (7000) and sends with csp_client -z through the subscribe port (6000)"
interface = "zmq"
meaning = "Node 2 to node 1: the leading destination byte is 1."
protocol = "CSP v1 over ZeroMQ (libcsp zmqhub), one CSP packet per message"
csp_version = 1
source_address = 2
destination_address = 1
priority = 2
destination_port = 1
csp_flags = 0
payload_length = 1
trailer_length = 0
packet_count = 1
expected_message_count = 1
expected_messages_hex = ["01 84 10 52 00 55"]
expected_destination_prefixes = [1]
expected_csp_headers_hex = ["84 10 52 00"]
expected_payloads_hex = ["55"]
