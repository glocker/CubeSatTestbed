name = "flag_hmac"
capture = "flag_hmac.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "zmqproxy & zmq_capture tcp://127.0.0.1:7000 1 15 /app/tests/golden_vectors/csp_v1/zmq/flag_hmac.txt & /app/tests/golden_vectors/bin/csp_client -z 127.0.0.1 -p -v 1 -a 1 -d 2 -r 2 -l 4 -o hmac"
capture_command = "regenerate-v1-whole-packet-vectors.py runs libcsp's zmqproxy hub, subscribes zmq_capture to its publish port (7000) and sends with csp_client -z through the subscribe port (6000)"
interface = "zmq"
meaning = "The HMAC flag: a 4-byte HMAC trailer in the payload."
protocol = "CSP v1 over ZeroMQ (libcsp zmqhub), one CSP packet per message"
csp_version = 1
source_address = 1
destination_address = 2
priority = 2
destination_port = 1
csp_flags = 8
payload_length = 4
trailer_length = 4
packet_count = 1
expected_message_count = 1
expected_messages_hex = ["02 82 20 52 08 55 56 57 58 52 8C 9E 11"]
expected_destination_prefixes = [2]
expected_csp_headers_hex = ["82 20 52 08"]
expected_payloads_hex = ["55 56 57 58 52 8c 9e 11"]
