name = "two_packets"
capture = "two_packets.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "python3 /app/tests/golden_vectors/scripts/capture-kiss.py /app/tests/golden_vectors/csp_v1/kiss/two_packets.txt 2 -- /app/tests/golden_vectors/bin/csp_client -k {tty} -p -v 1 -a 1 -d 2 -r 2 -l 3 -n 2"
capture_command = "capture-kiss.py opens a pty pair, runs csp_client -k <pty slave> and records the bytes libcsp's KISS interface writes"
interface = "pty"
meaning = "Two back-to-back packets: two frames, and the source port in the header, which libcsp picks per connection, is the one field that differs."
protocol = "CSP v1 over KISS (serial), one CSP packet per frame"
csp_version = 1
source_address = 1
destination_address = 2
priority = 2
destination_port = 1
csp_flags = 0
payload_length = 3
trailer_length = 0
packet_count = 2
expected_frame_count = 2
expected_frames_hex = ["C0 00 82 20 52 00 55 56 57 DB DC CE B0 C2 C0", "C0 00 82 20 53 00 55 56 57 DB DC CE B0 C2 C0"]
expected_packets_hex = ["82 20 52 00 55 56 57 C0 CE B0 C2", "82 20 53 00 55 56 57 C0 CE B0 C2"]
expected_csp_headers_hex = ["82 20 52 00", "82 20 53 00"]
expected_payloads_hex = ["55 56 57", "55 56 57"]
