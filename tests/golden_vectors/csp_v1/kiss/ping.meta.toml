name = "ping"
capture = "ping.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "python3 /app/tests/golden_vectors/scripts/capture-kiss.py /app/tests/golden_vectors/csp_v1/kiss/ping.txt 1 -- /app/tests/golden_vectors/bin/csp_client -k {tty} -p -v 1 -a 1 -d 2 -r 2 -l 1"
capture_command = "capture-kiss.py opens a pty pair, runs csp_client -k <pty slave> and records the bytes libcsp's KISS interface writes"
interface = "pty"
meaning = "Baseline CSP v1 ping-port request over KISS from node 1 to node 2 with a 1-byte payload 0x55 and no flags: the 4-byte header, the payload and a 4-byte CRC32 in one frame."
protocol = "CSP v1 over KISS (serial), one CSP packet per frame"
csp_version = 1
source_address = 1
destination_address = 2
priority = 2
destination_port = 1
csp_flags = 0
payload_length = 1
trailer_length = 0
packet_count = 1
expected_frame_count = 1
expected_frames_hex = ["C0 00 82 20 52 00 55 36 A9 9D 9E C0"]
expected_packets_hex = ["82 20 52 00 55 36 A9 9D 9E"]
expected_csp_headers_hex = ["82 20 52 00"]
expected_payloads_hex = ["55"]
