name = "high_address"
capture = "high_address.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "python3 /app/tests/golden_vectors/scripts/capture-kiss.py /app/tests/golden_vectors/csp_v1/kiss/high_address.txt 1 -- /app/tests/golden_vectors/bin/csp_client -k {tty} -p -v 1 -a 30 -d 29 -r 2 -l 1"
capture_command = "capture-kiss.py opens a pty pair, runs csp_client -k <pty slave> and records the bytes libcsp's KISS interface writes"
interface = "pty"
meaning = "Between the highest usable CSP v1 addresses (30 to 29; 31 is the broadcast address): the 5-bit address fields are full."
protocol = "CSP v1 over KISS (serial), one CSP packet per frame"
csp_version = 1
source_address = 30
destination_address = 29
priority = 2
destination_port = 1
csp_flags = 0
payload_length = 1
trailer_length = 0
packet_count = 1
expected_frame_count = 1
expected_frames_hex = ["C0 00 BD D0 52 00 55 36 A9 9D 9E C0"]
expected_packets_hex = ["BD D0 52 00 55 36 A9 9D 9E"]
expected_csp_headers_hex = ["BD D0 52 00"]
expected_payloads_hex = ["55"]
