name = "flag_crc32"
capture = "flag_crc32.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "python3 /app/tests/golden_vectors/scripts/capture-kiss.py /app/tests/golden_vectors/csp_v1/kiss/flag_crc32.txt 1 -- /app/tests/golden_vectors/bin/csp_client -k {tty} -p -v 1 -a 1 -d 2 -r 2 -l 4 -o crc32"
capture_command = "capture-kiss.py opens a pty pair, runs csp_client -k <pty slave> and records the bytes libcsp's KISS interface writes"
interface = "pty"
meaning = "The CRC32 flag: libcsp appends its own 4-byte trailer to the payload, and the KISS interface then adds its CRC32 over both, so there are two checksums."
protocol = "CSP v1 over KISS (serial), one CSP packet per frame"
csp_version = 1
source_address = 1
destination_address = 2
priority = 2
destination_port = 1
csp_flags = 1
payload_length = 4
trailer_length = 4
packet_count = 1
expected_frame_count = 1
expected_frames_hex = ["C0 00 82 20 52 01 55 56 57 58 AB F7 49 CE 7A C3 5F 61 C0"]
expected_packets_hex = ["82 20 52 01 55 56 57 58 AB F7 49 CE 7A C3 5F 61"]
expected_csp_headers_hex = ["82 20 52 01"]
expected_payloads_hex = ["55 56 57 58 ab f7 49 ce"]
