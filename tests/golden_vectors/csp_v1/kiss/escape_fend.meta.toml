name = "escape_fend"
capture = "escape_fend.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "python3 /app/tests/golden_vectors/scripts/capture-kiss.py /app/tests/golden_vectors/csp_v1/kiss/escape_fend.txt 1 -- /app/tests/golden_vectors/bin/csp_client -k {tty} -p -v 1 -a 1 -d 2 -r 2 -l 4 -b 0xc0"
capture_command = "capture-kiss.py opens a pty pair, runs csp_client -k <pty slave> and records the bytes libcsp's KISS interface writes"
interface = "pty"
meaning = "Payload bytes 0xC0..0xC3: the FEND byte is sent as FESC TFEND (DB DC)."
protocol = "CSP v1 over KISS (serial), one CSP packet per frame"
csp_version = 1
source_address = 1
destination_address = 2
priority = 2
destination_port = 1
csp_flags = 0
payload_length = 4
trailer_length = 0
packet_count = 1
expected_frame_count = 1
expected_frames_hex = ["C0 00 82 20 52 00 DB DC C1 C2 C3 AB 2E 61 D8 C0"]
expected_packets_hex = ["82 20 52 00 C0 C1 C2 C3 AB 2E 61 D8"]
expected_csp_headers_hex = ["82 20 52 00"]
expected_payloads_hex = ["c0 c1 c2 c3"]
