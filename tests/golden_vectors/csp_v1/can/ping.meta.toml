name = "ping"
capture = "ping.txt"
libcsp_repo = "https://github.com/libcsp/libcsp"
libcsp_tag = "v2.1"
libcsp_commit = "48f7fb0"
command = "/app/tests/golden_vectors/bin/csp_client -c vcan0 -p -v 1 -a 1 -d 2 -r 2 -l 1"
capture_command = "candump -n 1 vcan0 > /app/tests/golden_vectors/csp_v1/can/ping.txt"
interface = "vcan0"
meaning = "Single-frame CSP v1 ping-port request from node 1 to node 2 with one 0x55 payload byte, normal priority, no flags."
protocol = "CSP v1 over classic CAN 2.0B extended frames, CFP1 fragmented"
csp_version = 1
source_address = 1
destination_address = 2
priority = 2
destination_port = 1
csp_flags = 0
payload_length = 1
trailer_length = 0
packet_count = 1
expected_frame_count = 1
expected_extended_can_ids = ["0x01100000"]
expected_frame_payloads_hex = ["82 20 52 00 00 01 55"]
expected_csp_headers_hex = ["82 20 52 00"]
expected_reassembled_payloads_hex = ["55"]
