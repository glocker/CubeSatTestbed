services:
  libcsp-vectors:
    build:
      context: .
      args:
        LIBCSP_REPO: https://github.com/libcsp/libcsp.git
        LIBCSP_TAG: v2.1
        LIBCSP_COMMIT: 48f7fb0
    image: cubesat-testbed-libcsp-vectors:libcsp-v2.1
    working_dir: /app
    # Required to create and bring up vcan0 inside the container network namespace.
    privileged: true
    volumes:
      # Captures and the generated helper must land in the working tree, not only
      # inside the container filesystem.
      - .:/app
    environment:
      CAN_INTERFACE: vcan0
    command: ["sleep", "infinity"]
