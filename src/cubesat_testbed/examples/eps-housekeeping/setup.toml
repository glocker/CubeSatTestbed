# One housekeeping packet carrying seven EPS signals, instead of one packet per signal.
# The fields include a fixed-length array (the two cell voltages) and two bit fields
# sharing the last byte; an OBC rule watches one element of the array.

[transport]
type = "in-memory"

[nodes.obc]
mode = "simulated"
module_type = "obc_peer"
address = 1

[nodes.eps]
mode = "simulated"
module_type = "generic_eps"
address = 2

[nodes.payload]
mode = "simulated"
module_type = "simple_payload"
address = 3

[nodes.obc.commands.payload_power_off]
target = "payload"
destination_port = 10
source_port = 10
payload_hex = "00"

# The packet: addressing once, then each field's place in the 25-byte payload.
[nodes.eps.packets.housekeeping]
source_port = 20
destination_port = 20
to = "obc"

[nodes.eps.packets.housekeeping.fields.battery_voltage_v]
offset = 0
length = 4
type = "float"
units = "V"

[nodes.eps.packets.housekeeping.fields.battery_percent]
offset = 4
length = 4
type = "float"
units = "percent"

[nodes.eps.packets.housekeeping.fields.load_power_w]
offset = 8
length = 4
type = "float"
units = "W"

[nodes.eps.packets.housekeeping.fields.solar_input_w]
offset = 12
length = 4
type = "float"
units = "W"

# An array: two 4-byte floats back to back (bytes 16-23). Scenarios and rules name
# one element as eps.telemetry.cell_voltages_v[0] or [1].
[nodes.eps.packets.housekeeping.fields.cell_voltages_v]
offset = 16
length = 4
count = 2
type = "float"
units = "V"

# Two bit fields in byte 24. Bits count from the byte's most significant bit:
# power_mode is the top two bits, payload_rail_enabled the next one.
[nodes.eps.packets.housekeeping.fields.power_mode]
offset = 24
bit_offset = 0
bit_length = 2
type = "uint"

[nodes.eps.packets.housekeeping.fields.power_mode.enum]
0 = "nominal"
1 = "low_power"
2 = "safe"
3 = "off"

[nodes.eps.packets.housekeeping.fields.payload_rail_enabled]
offset = 24
bit_offset = 2
bit_length = 1
type = "uint"

[nodes.payload.telemetry.power_status]
source_port = 21
destination_port = 21
offset = 0
length = 1
type = "uint"

[nodes.payload.telemetry.power_status.enum]
0 = "offline"
1 = "online"

# A rule on one element of the array: a failing second cell sheds the payload.
[nodes.obc.rules.weak_cell_shed_payload]
signal = "eps.telemetry.cell_voltages_v[1]"
op = "<"
threshold = 3.0
for = "2s"

[[nodes.obc.rules.weak_cell_shed_payload.actions]]
type = "send_command"
command = "payload_power_off"
